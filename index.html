<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Prototype - Upload</title>
  <!-- Ícones do Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">
        <i data-lucide="music"></i>
        <span>Music Studio</span>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" data-view="upload">
          <i data-lucide="upload"></i>
          <span>Upload</span>
        </button>
        <button class="nav-item" data-view="library">
          <i data-lucide="library"></i>
          <span>Sua Biblioteca</span>
        </button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div class="user-profile">
          <button id="logout-btn" class="profile-btn" type="button">
            <i data-lucide="user"></i>
            <span id="profile-name">Artista / Produtor</span>
          </button>
        </div>
      </header>

      <section id="view-upload" class="view active">
        <div class="upload-section">
          <h1>Enviar Nova Música</h1>
          <p class="subtitle">Faça o upload do seu arquivo MP3 e o sistema tenta preencher os dados automaticamente.</p>

          <form id="upload-form" class="upload-form">
            <div class="file-dropzone">
              <input type="file" id="audio-file" name="audio" accept=".mp3,audio/mpeg" webkitdirectory directory multiple required>
              <label for="audio-file" class="dropzone-label">
                <i data-lucide="upload-cloud" class="upload-icon"></i>
                <span class="primary-text" id="file-name-display">Selecione uma pasta com suas músicas</span>
                <span class="secondary-text">ou escolha vários arquivos MP3</span>
                <span class="file-limit">Até 100 arquivos .MP3 (Máx. 15MB cada)</span>
              </label>
            </div>

            <div class="form-group">
              <label for="title">Título da Música</label>
              <input type="text" id="title" name="title" placeholder="Será preenchido automaticamente quando disponível">
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="artist">Artista / Banda</label>
                <input type="text" id="artist" name="artist" placeholder="Será preenchido automaticamente quando disponível">
              </div>

              <div class="form-group">
                <label for="genre">Gênero</label>
                <select id="genre" name="genre">
                  <option value="">Automático</option>
                  <option value="pop">Pop</option>
                  <option value="rock">Rock</option>
                  <option value="hiphop">Hip Hop</option>
                  <option value="electronic">Eletrônica</option>
                  <option value="indie">Indie</option>
                </select>
              </div>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">Salvar no Banco de Dados</button>
          </form>
        </div>
      </section>

      <section id="view-library" class="view">
        <div class="library-header">
          <div>
            <p class="eyebrow">Coleção</p>
            <h1>Sua Biblioteca</h1>
          </div>
          <button id="refresh-library" class="ghost-btn" type="button">Atualizar</button>
        </div>

        <div id="library-list" class="library-list"></div>
      </section>
    </main>
  </div>

  <footer class="player-bar">
    <div class="now-playing">
      <div class="cover-placeholder" id="player-cover"></div>
      <div class="track-info">
        <span class="track-title" id="player-title">Nenhuma música selecionada</span>
        <span class="track-artist" id="player-artist">Aguardando upload</span>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button id="previous-btn" class="control-btn" type="button" aria-label="Música anterior">
          <i data-lucide="skip-back"></i>
        </button>
        <button id="play-btn" class="control-btn play-btn" type="button" aria-label="Reproduzir / Pausar">
          <i data-lucide="play"></i>
        </button>
        <button id="next-btn" class="control-btn" type="button" aria-label="Próxima música">
          <i data-lucide="skip-forward"></i>
        </button>
      </div>
      <div class="playback-bar">
        <span id="current-time" class="time-display">0:00</span>
        <div class="progress-bar-container" id="progress-container" role="slider" aria-label="Progresso da música" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="progress-bar" id="progress-bar">
            <div class="progress-handle"></div>
          </div>
        </div>
        <span id="total-duration" class="time-display">0:00</span>
      </div>
    </div>

    <div class="volume-controls">
      <button id="mute-btn" type="button" class="volume-btn" aria-label="Silenciar">
        <i data-lucide="volume-2"></i>
      </button>
      <div class="volume-bar-container" id="volume-container" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" tabindex="0">
        <div class="volume-progress" id="volume-bar">
          <div class="volume-handle"></div>
        </div>
      </div>
    </div>
  </footer>

  <audio id="audio-player"></audio>

  <script src="index.js"></script>
</body>
</html>
